AWSTemplateFormatVersion: 2010-09-09
Description: |
  IAM role for Cresta Amazon Connect Data Access. It supports External ID for third party access.
  More information: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_third-party.html
Parameters:
  SourceBucketName:
    Description: >-
      Name of the S3 bucket containing recordings or transcriptions.
      Enter only the bucket name, without s3:// or a folder path. Example: acme-connect-recordings
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: Enter a valid S3 bucket name without s3:// or a folder path
  ConnectInstanceId:
    Description: >-
      ID of the Amazon Connect instance. This is the value after instance/ in its ARN.
      Example: 12345678-1234-1234-1234-123456789012
    Type: String
    AllowedPattern: .+
    ConstraintDescription: ConnectInstanceId is required
  ExternalId:
    Description: >-
      Optional external ID provided by your Cresta account manager. Leave blank if none was provided.
      Example: acme-connect
    Type: String
    Default: ""
  IAMRoleName:
    Description: >-
      Name of the IAM role created for Cresta. Keep the default unless instructed otherwise.
      Example: CrestaIngestionRole
    Type: String
    Default: CrestaIngestionRole
  CrestaAWSAccountIds:
    Description: >-
      Cresta AWS account IDs allowed to assume the role. Keep the prefilled value unchanged.
    Type: CommaDelimitedList
    Default: 510370324380,488350602631,730335187493,975050116558,302217641952,107136125828
Conditions:
  HasExternalId: !Not [!Equals [!Ref ExternalId, ""]]
Resources:
  CrestaIngestionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Split
                - ","
                - !Sub
                  - arn:aws:iam::${account}:root
                  - account: !Join
                      - ":root,arn:aws:iam::"
                      - !Ref CrestaAWSAccountIds
            Action:
              - "sts:AssumeRole"
            Condition: !If
              - HasExternalId
              - StringEquals:
                  "sts:ExternalId": !Ref ExternalId
              - !Ref "AWS::NoValue"
      RoleName: !Ref IAMRoleName
      Policies:
        - PolicyName: CrestaPostcallAccessS3
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              Effect: Allow
              Resource:
                - !Sub "arn:aws:s3:::${SourceBucketName}"
                - !Sub "arn:aws:s3:::${SourceBucketName}/*"
              Action:
                - "s3:Get*"
                - "s3:List*"
        - PolicyName: CrestaPostcallAccessConnect
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              Effect: Allow
              Resource: 
                - !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}"
                - !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}/*"
              Action:
                - "connect:ListQueues"
                - "connect:ListUsers"
                - "connect:SearchUsers"
                - "connect:DescribeUser"
                - "connect:DescribeContact"
                - "connect:SearchContacts"
                - "connect:ListInstanceStorageConfigs"
Outputs:
  ExternalId:
    Description: Optional external ID for the data access role
    Value: !Ref ExternalId
  SourceBucketName:
    Description: S3 Bucket with source data for transfer
    Value: !Ref SourceBucketName
  IAMRoleName:
    Description: AWS IAM Role named to be used with Cresta Data Ingestion
    Value: !Ref CrestaIngestionRole
  AccountId:
    Description: AWS Account number
    Value: !Ref "AWS::AccountId"
  RoleArn:
    Description: Arn of Created Role
    Value: !GetAtt CrestaIngestionRole.Arn
  Region:
    Description: AWS Region
    Value: !Ref "AWS::Region"
